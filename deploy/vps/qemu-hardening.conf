# Delta de hardening para /etc/libvirt/qemu.conf no nó VPS (sp-local).
#
# NÃO é o arquivo inteiro — são as chaves que devem ser DESCOMENTADAS/AJUSTADAS
# a partir do default (hoje 100% comentado). Aplicar e `sudo systemctl restart libvirtd`
# (ou virtqemud). Testar subir/derrubar UMA VM antes de expor.
#
# Justificativa: entregamos ROOT ao tenant dentro da VM; a fronteira de segurança é o
# qemu/KVM confinado por sVirt/AppArmor. Isto torna o confinamento explícito e fail-closed.

# sVirt via AppArmor, explícito (não herdar default).
security_driver = "apparmor"

# Fail-closed: recusa iniciar qualquer domínio que NÃO possa ser confinado.
security_default_confined = 1
security_require_confined = 1

# qemu roda sem privilégio, como usuário dedicado.
user = "libvirt-qemu"
group = "libvirt-qemu"
dynamic_ownership = 1

# Sandbox seccomp do qemu ligado.
seccomp_sandbox = 1

# Namespaces (mount) por domínio — isolamento adicional.
namespaces = [ "mount" ]

# ACL mínima de devices — SEM vfio/passthrough, sem blocos do host.
cgroup_device_acl = [
    "/dev/null", "/dev/full", "/dev/zero",
    "/dev/random", "/dev/urandom",
    "/dev/ptmx", "/dev/kvm", "/dev/net/tun"
]
