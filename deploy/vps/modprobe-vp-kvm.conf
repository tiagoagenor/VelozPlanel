# /etc/modprobe.d/vp-kvm.conf — desliga virtualização aninhada no nó VPS.
#
# Hoje o host está com `kvm_intel nested=Y`. Nested amplia a superfície de escape do
# hypervisor (caminhos L1/L2, CVEs históricos) sem benefício pro produto — Docker roda
# dentro da VM SEM nested. Desligar antes de vender.
#
# APLICAR:
#   sudo cp deploy/vps/modprobe-vp-kvm.conf /etc/modprobe.d/vp-kvm.conf
#   # sem VMs rodando:
#   sudo modprobe -r kvm_intel && sudo modprobe kvm_intel
#   # conferir:
#   cat /sys/module/kvm_intel/parameters/nested   # deve ser N
#
# (Para AMD, trocar kvm_intel -> kvm_amd.)

options kvm_intel nested=0
