# ─────────────────────────────────────────────────────────────────────────────
# DNS secundário (ns2) — roda SÓ no nó público (184). PowerDNS Authoritative
# como SLAVE, backend gsqlite3 (self-contained, sem Postgres no nó).
#
# "Nasce burro": via AUTOPRIMARY (supermaster). Quando o master (187, 10.77.0.1)
# manda um NOTIFY de uma zona nova, este secundário cria a zona sozinho e puxa
# todos os registros por AXFR pela WireGuard. Zero configuração por-zona aqui.
#
# BOOTSTRAP (uma vez, antes do primeiro up — cria o schema do sqlite e o
# autoprimary apontando para o master):
#   docker volume create velozdns_secondary
#   docker run --rm -v velozdns_secondary:/db powerdns/pdns-auth-49:latest \
#     sh -c 'test -f /db/pdns.sqlite3 || sqlite3 /db/pdns.sqlite3 < /usr/share/doc/pdns/schema.sqlite3.sql; \
#            sqlite3 /db/pdns.sqlite3 "INSERT OR IGNORE INTO supermasters (ip, nameserver, account) VALUES (\"10.77.0.1\", \"ns1.geestao.top\", \"veloz\");"'
#
# Subir (a partir deste diretório, NO 184):
#   docker compose -f docker-compose.dns-secondary.yml up -d
#
# Depois, no painel, cada zona já delegada aparece como "Ativo · 2 de 2 NS"
# assim que este secundário responde.
# ─────────────────────────────────────────────────────────────────────────────
name: velozplanel-dns-secondary

services:
  pdns-secondary:
    image: powerdns/pdns-auth-49:latest
    restart: unless-stopped
    # DNS autoritativo público (ns2). Única porta exposta.
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      PDNS_launch: gsqlite3
      PDNS_gsqlite3_database: /db/pdns.sqlite3
      # Secundário: aceita NOTIFY do master e faz AXFR dele.
      PDNS_slave: "yes"
      PDNS_master: "no"
      # Confia no master pela WireGuard para NOTIFY/AXFR.
      PDNS_allow_notify_from: 10.77.0.1
      PDNS_autosecondary: "yes"
      # Autoritativo apenas (sem recursão).
      PDNS_version_string: anonymous
      # API desligada no secundário (é gerenciado só pelo master via AXFR).
      PDNS_api: "no"
      PDNS_webserver: "no"
    volumes:
      - dnsdata:/db
    healthcheck:
      test: ["CMD-SHELL", "pdns_control ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  dnsdata:
    name: velozdns_secondary
    external: true
