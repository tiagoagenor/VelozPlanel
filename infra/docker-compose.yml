# Postgres do control plane (desenvolvimento local).
# Porta 5433 no host para não colidir com um Postgres local em 5432.
services:
  postgres:
    image: postgres:17-alpine
    container_name: vp-postgres
    environment:
      POSTGRES_USER: veloz
      POSTGRES_PASSWORD: veloz_dev
      POSTGRES_DB: velozpanel
    ports:
      - "5433:5432"
    volumes:
      - vp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veloz -d velozpanel"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MariaDB compartilhado do "nó" — hospeda os bancos MySQL-compatíveis dos clientes.
  # Porta 3307 no host para não colidir com um MySQL local em 3306.
  mariadb:
    image: mariadb:11
    container_name: vp-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: veloz_root_dev
    ports:
      - "3308:3306"
    volumes:
      - vp_mariadata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vp_pgdata:
  vp_mariadata:
